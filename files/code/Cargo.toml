[package]
name = "glox_gemini_cli"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
redb = "2.1"
fjall = "2.1"
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
