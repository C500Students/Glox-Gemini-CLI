<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182234"/>
      <stop offset="60%" stop-color="#0e1420"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>

    <!-- Rust Core Cog Gradients -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9940"/>
      <stop offset="45%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#802b00"/>
    </linearGradient>

    <!-- Banana Flare Gradients -->
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffb8f"/>
      <stop offset="40%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#e68a00"/>
    </linearGradient>

    <!-- Neon Cyber Accents -->
    <linearGradient id="pinkNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff71ce"/>
      <stop offset="100%" stop-color="#b92b8d"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#01cdfe"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>

    <!-- Terminal Screen Glass -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= CANVAS BASE ================= -->
  <!-- Outer Rounded Squircle Icon Boundary -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1f2d42" stroke-width="4"/>

  <!-- Subtle Cyber Reticle Orbit -->
  <circle cx="256" cy="240" r="216" fill="none" stroke="#01cdfe" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3"/>
  <circle cx="256" cy="240" r="198" fill="none" stroke="#ff71ce" stroke-width="2" stroke-dasharray="40 18 10 18" opacity="0.5"/>

  <!-- ================= FOUNDATION: RUST ENGINE COG ================= -->
  <g id="rustGear" transform="translate(256, 240)">
    <!-- 8 Cog Teeth -->
    <g fill="url(#rustGrad)" stroke="#591c00" stroke-width="2">
      <!-- 0 deg -->
      <rect x="-24" y="-188" width="48" height="42" rx="6"/>
      <!-- 45 deg -->
      <rect x="-24" y="-188" width="48" height="42" rx="6" transform="rotate(45)"/>
      <!-- 90 deg -->
      <rect x="-24" y="-188" width="48" height="42" rx="6" transform="rotate(90)"/>
      <!-- 135 deg -->
      <rect x="-24" y="-188" width="48" height="42" rx="6" transform="rotate(135)"/>
      <!-- 180 deg -->
      <rect x="-24" y="-188" width="48" height="42" rx="6" transform="rotate(180)"/>
      <!-- 225 deg -->
      <rect x="-24" y="-188" width="48" height="42" rx="6" transform="rotate(225)"/>
      <!-- 270 deg -->
      <rect x="-24" y="-188" width="48" height="42" rx="6" transform="rotate(270)"/>
      <!-- 315 deg -->
      <rect x="-24" y="-188" width="48" height="42" rx="6" transform="rotate(315)"/>
      <!-- Outer Rim Body -->
      <circle cx="0" cy="0" r="162"/>
    </g>

    <!-- Inset Groove -->
    <circle cx="0" cy="0" r="144" fill="#0d131e" stroke="#ff9940" stroke-width="3"/>
  </g>

  <!-- ================= CRESCENT NANO-BANANA WINGS ================= -->
  <!-- Left Banana Booster Blade -->
  <path d="M 125 150 
           C 70 210, 80 310, 140 370 
           C 120 320, 125 240, 165 190 
           C 178 175, 150 140, 125 150 Z" 
        fill="url(#bananaGrad)" stroke="#b36b00" stroke-width="3" filter="url(#softGlow)"/>
  <!-- Stem Tip Accent -->
  <polygon points="125,150 116,140 130,136" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>

  <!-- Right Banana Booster Blade -->
  <path d="M 387 150 
           C 442 210, 432 310, 372 370 
           C 392 320, 387 240, 347 190 
           C 334 175, 362 140, 387 150 Z" 
        fill="url(#bananaGrad)" stroke="#b36b00" stroke-width="3" filter="url(#softGlow)"/>
  <!-- Stem Tip Accent -->
  <polygon points="387,150 396,140 382,136" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>

  <!-- ================= GLOX BOT CRT MONITOR CHASSIS ================= -->
  <g transform="translate(256, 236)">
    <!-- Monitor Outer Shell -->
    <rect x="-116" y="-96" width="232" height="186" rx="36" fill="#1b2434" stroke="#ff71ce" stroke-width="4" filter="url(#coreGlow)"/>
    <!-- Inset Bezel -->
    <rect x="-102" y="-82" width="204" height="158" rx="24" fill="url(#screenGlass)" stroke="#01cdfe" stroke-width="2.5"/>

    <!-- Dual Antennas -->
    <line x1="-54" y1="-96" x2="-80" y2="-132" stroke="#ff71ce" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-83" cy="-136" r="8" fill="#ffd000" stroke="#ff71ce" stroke-width="2"/>

    <line x1="54" y1="-96" x2="80" y2="-132" stroke="#ff71ce" stroke-width="5" stroke-linecap="round"/>
    <circle cx="83" cy="-136" r="8" fill="#01cdfe" stroke="#ff71ce" stroke-width="2"/>

    <!-- ================= SCREEN CONTENTS: CLI & ANIME MECHA VISAGE ================= -->
    <!-- Screen Scanlines -->
    <line x1="-96" y1="-50" x2="96" y2="-50" stroke="#01cdfe" stroke-width="1" opacity="0.15"/>
    <line x1="-96" y1="-15" x2="96" y2="-15" stroke="#01cdfe" stroke-width="1" opacity="0.15"/>
    <line x1="-96" y1="20" x2="96" y2="20" stroke="#01cdfe" stroke-width="1" opacity="0.15"/>
    <line x1="-96" y1="55" x2="96" y2="55" stroke="#01cdfe" stroke-width="1" opacity="0.15"/>

    <!-- Terminal Command Line Header -->
    <g transform="translate(-82, -56)">
      <!-- Mini Terminal Prompt Symbol -->
      <path d="M 0 0 L 10 7 L 0 14" stroke="#05ffa1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="18" y1="14" x2="32" y2="14" stroke="#ff71ce" stroke-width="3" stroke-linecap="round"/>
      <!-- Identicon 3x3 Micro Stamp -->
      <g transform="translate(142, -2)" fill="#ff71ce">
        <rect x="0" y="0" width="4" height="4"/>
        <rect x="8" y="0" width="4" height="4"/>
        <rect x="16" y="0" width="4" height="4"/>
        <rect x="4" y="4" width="4" height="4"/>
        <rect x="12" y="4" width="4" height="4"/>
        <rect x="0" y="8" width="4" height="4"/>
        <rect x="8" y="8" width="4" height="4"/>
        <rect x="16" y="8" width="4" height="4"/>
      </g>
    </g>

    <!-- Mecha Expressive Eyes (Joy/Active Optics) -->
    <!-- Left Eye Arc -->
    <g transform="translate(-44, 2)">
      <path d="M -22 10 Q 0 -18 22 10" fill="none" stroke="#00ffcc" stroke-width="8" stroke-linecap="round" filter="url(#coreGlow)"/>
      <circle cx="0" cy="-2" r="3.5" fill="#ffffff"/>
      <!-- Cheek Sensor Decal -->
      <rect x="-18" y="22" width="14" height="4" rx="2" fill="#ff71ce"/>
      <rect x="-14" y="29" width="10" height="3" rx="1.5" fill="#ff71ce"/>
    </g>

    <!-- Right Eye Arc -->
    <g transform="translate(44, 2)">
      <path d="M -22 10 Q 0 -18 22 10" fill="none" stroke="#00ffcc" stroke-width="8" stroke-linecap="round" filter="url(#coreGlow)"/>
      <circle cx="0" cy="-2" r="3.5" fill="#ffffff"/>
      <!-- Cheek Sensor Decal -->
      <rect x="4" y="22" width="14" height="4" rx="2" fill="#ff71ce"/>
      <rect x="4" y="29" width="10" height="3" rx="1.5" fill="#ff71ce"/>
    </g>

    <!-- Center Mouth Line / Power LED -->
    <path d="M -10 38 Q 0 46 10 38" fill="none" stroke="#ffd000" stroke-width="3" stroke-linecap="round"/>

    <!-- Screen Glass Glare Shard -->
    <polygon points="-98,-78 20,-78 -40,70 -98,70" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- ================= LOWER BRAND TYPOGRAPHY ================= -->
  <!-- Nameplate Banner Plaque -->
  <g transform="translate(256, 442)">
    <!-- Base Plate -->
    <rect x="-180" y="-28" width="360" height="52" rx="12" fill="#0d131e" stroke="#25354e" stroke-width="2.5"/>
    <rect x="-176" y="-24" width="352" height="44" rx="8" fill="none" stroke="#01cdfe" stroke-width="1" opacity="0.4"/>

    <!-- Dual Side Accent Nodes -->
    <circle cx="-160" cy="-2" r="4" fill="#ff71ce" filter="url(#softGlow)"/>
    <circle cx="160" cy="-2" r="4" fill="#ffd000" filter="url(#softGlow)"/>

    <!-- Primary Brand Wordmark -->
    <text x="0" y="7" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="6" text-anchor="middle">
      GLOX<tspan fill="#ff9940">::</tspan><tspan fill="#01cdfe">CLI</tspan>
    </text>

    <!-- Sub-label -->
    <text x="0" y="38" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#ff71ce" letter-spacing="4" text-anchor="middle">
      GEMINI • REDB • FJALL
    </text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 36 64 L 36 36 L 64 36" stroke="#01cdfe" stroke-width="3" fill="none"/>
  <path d="M 476 64 L 476 36 L 448 36" stroke="#01cdfe" stroke-width="3" fill="none"/>
  <path d="M 36 448 L 36 476 L 64 476" stroke="#01cdfe" stroke-width="3" fill="none"/>
  <path d="M 476 448 L 476 476 L 448 476" stroke="#01cdfe" stroke-width="3" fill="none"/>
</svg>
